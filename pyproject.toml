[project]
name = "excel-bid-extractor"
version = "0.1.0"
description = "Extracción de cotizaciones desde informes Excel de estructura variable: la IA ubica las celdas y el código copia, corrige y valida"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "xlsxwriter>=3.3.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Equivalentes de las reglas de SonarQube: complejidad, argumentos, nombres, parámetros sin usar y código muerto.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C90", "PL", "ARG", "N", "PIE", "RET", "RSE", "TRY", "ERA"]
ignore = ["PLR2004", "TRY003"]  # números y mensajes de error en línea: legibles en reglas de negocio

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.pytest.ini_options]
testpaths = ["tests"]
